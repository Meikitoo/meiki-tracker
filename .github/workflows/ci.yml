# Vérifications automatiques à chaque envoi sur GitHub (tests + types).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      # L'interface compilée est intégrée au binaire : nécessaire avant les tests Rust.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
